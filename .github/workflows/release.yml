name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v2.8.1)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        arch: [amd64, arm64]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Build complete native offline bundle
        run: |
          set -euo pipefail
          mkdir -p offline-dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/offline-dist:/out" "$IMAGE" bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3-venv ca-certificates
            python3 -m venv /tmp/bootstrap
            /tmp/bootstrap/bin/pip install tomli
            cp -a /src /tmp/source
            /tmp/bootstrap/bin/python /tmp/source/tools/build_offline.py /tmp/source /out
          '
      - name: Install in a fresh container with networking disabled
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('offline-dist').glob('*.zip'))) as archive:
              archive.extractall('offline-test')
          PY
          folder=$(find "$PWD/offline-test" -mindepth 1 -maxdepth 1 -type d)
          docker run --rm --network none -v "$folder:/bundle:ro" "$IMAGE" bash -ec '
            bash /bundle/install-offline.sh
            splitforge --version
            splitforge --help >/dev/null
            /opt/splitforge-certbot/bin/certbot --version
            for binary in xray tun2socks dnstt-client noizdns-client slipstream-client; do
              test -x "/usr/local/bin/$binary"
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ strategy.job-index }}
          path: offline-dist/*.zip
          compression-level: 0
          retention-days: 3

  publish:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          path: dist
          merge-multiple: true
      - name: Validate version and build distributions
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['TAG']
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'v' + version:
              raise SystemExit('Release tag must match the package version')
          PY
          python -m pip install build
          python -m build
          cd dist
          sha256sum *.whl *.tar.gz *.zip > SHA256SUMS
      - name: Attach verified distributions to the release
        env:
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
      - name: Publish distribution archive to GitHub Packages
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:$TAG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          printf 'FROM scratch\nCOPY dist/ /dist/\n' > "$RUNNER_TEMP/Dockerfile.release"
          docker build -f "$RUNNER_TEMP/Dockerfile.release" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=SplitForge Python distributions; archive only, not a runnable container" \
            -t "$image" .
          docker push "$image"
