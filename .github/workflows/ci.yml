name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e .
      - run: python -m pip install build ruff
      - run: ruff check splitforge tests --select F
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.python }}
          path: dist/*
  linux-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install into a stable root-owned environment
        run: sudo bash install.sh
      - name: Exercise actual namespaces, guards, proxy transports and WireGuard
        run: sudo env SPLITFORGE_INTEGRATION=1 /opt/splitforge/venv/bin/python -m unittest discover -s tests -v
