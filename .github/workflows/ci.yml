name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e .
      - run: python -m pip install build ruff
      - run: ruff check splitforge tests --select F
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.python }}
          path: dist/*
  linux-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install into a stable root-owned environment
        run: sudo bash install.sh
      - name: Install nginx for real HTTPS proxy tests
        run: sudo apt-get install -y --no-install-recommends nginx
      - name: Exercise actual namespaces, guards, proxy transports and WireGuard
        run: sudo env SPLITFORGE_INTEGRATION=1 /opt/splitforge/venv/bin/python -m unittest discover -s tests -v
  web-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv .venv && .venv/bin/pip install -c requirements.lock -e .
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise the actual web panel in Chromium
        env:
          SPLITFORGE_SCREENSHOTS: test-results
        run: |
          .venv/bin/python -m splitforge web --demo > /tmp/splitforge-web.log 2>&1 &
          panel_pid=$!
          trap 'kill "$panel_pid"' EXIT
          node tests/web_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: test-results/
