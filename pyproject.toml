[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitforge"
version = "2.4.2"
description = "Per-application Linux network namespace routing with a Textual terminal UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SplitForge contributors"}]
dependencies = [
  "textual>=0.89,<9",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "psutil>=6,<8",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
]

[project.scripts]
splitforge = "splitforge.cli:main"

[project.urls]
Repository = "https://github.com/EclipseOfficialDota/SplitForge"
Issues = "https://github.com/EclipseOfficialDota/SplitForge/issues"

[tool.setuptools.packages.find]
include = ["splitforge*"]

[tool.setuptools.package-data]
"splitforge.tui" = ["*.tcss"]
"splitforge.web" = ["static/*.html", "static/*.css", "static/*.js"]
